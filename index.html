<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muse – Legal & Support</title>
    <meta name="description" content="Privacy Policy and Support information for the Muse app." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0A0A0A;
            --surface: #111111;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #A78BFA;
            --accent2: #60A5FA;
            --text: #F1F5F9;
            --muted: #94A3B8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 2rem;
            box-shadow: 0 0 40px rgba(167, 139, 250, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.75rem;
        }

        .subtitle {
            color: var(--muted);
            font-size: 1rem;
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-decoration: none;
            color: var(--text);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(167, 139, 250, 0.4);
            box-shadow: 0 8px 32px rgba(167, 139, 250, 0.15);
        }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
            display: block;
        }

        .card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .card p {
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.5;
        }

        footer {
            color: var(--muted);
            font-size: 0.8rem;
        }

        @media (max-width: 480px) {
            .cards {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🎵</div>
        <h1>Muse</h1>
        <p class="subtitle">Your AI-powered frontend engineering companion.<br />Resources and legal information for the
            app.</p>

        <div class="cards">
            <a class="card" href="privacy-policy.html">
                <span class="card-icon">🔒</span>
                <h2>Privacy Policy</h2>
                <p>How we collect, use, and protect your personal data.</p>
            </a>
            <a class="card" href="support.html">
                <span class="card-icon">💬</span>
                <h2>Support</h2>
                <p>Get help, report issues, or contact us directly.</p>
            </a>
        </div>

        <footer>
            &copy; 2025 Muse &nbsp;·&nbsp; com.frontendmuse.app
        </footer>
    </div>
</body>

</html>
